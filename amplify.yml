version: 1
frontend:
  phases:
  preBuild:
    commands:
      - echo "Installing Node.js 18.19.0"
      - nvm install 18.19.0
      - nvm use 18.19.0
      - node -v
      - npm -v
      - echo "Installing dependencies"
      - npm ci --prefer-offline
      - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules